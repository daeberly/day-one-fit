<title>Day One Fit</title>
<style>
:root{--bg:#0f1417;--card:#182026;--card2:#1f2a31;--text:#e8eef2;--muted:#8fa1ad;--accent:#2dd4a7;--accent2:#0f6e56;--warn:#f5a524;--bad:#ef6b6b;--line:#2a3640;--blue:#6aa8ff;--purple:#b794f6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px calc(96px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:4px 0 2px;font-weight:700}
h2{font-size:18px;margin:18px 2px 8px;font-weight:700}
h3{font-size:16px;margin:0 0 8px;font-weight:700}
p{margin:6px 0}
.muted{color:var(--muted)}.small{font-size:13px}.err{color:var(--bad);font-size:13px;min-height:16px;margin-top:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card.sub{background:var(--card2)}
.row{display:flex;gap:8px;align-items:center}.row.wrap{flex-wrap:wrap}.sp{flex:1}
.in{background:#0f1417;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px;font-size:16px;min-width:0;width:100%}
.in:focus{outline:2px solid var(--accent);border-color:transparent}
.in.big{font-size:22px;font-weight:700;width:46%}
.in.full{margin-top:8px}
.btn{background:var(--accent);color:#06241c;border:0;border-radius:12px;padding:12px 16px;font-size:16px;font-weight:700;width:100%;margin-top:10px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{width:auto;padding:8px 12px;font-size:14px;margin-top:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip input{display:none}
.chip span,.pill{display:inline-block;padding:7px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:14px;cursor:pointer;background:transparent}
.chip input:checked+span,.pill.on{background:var(--accent);color:#06241c;border-color:var(--accent);font-weight:700}
.nav{display:flex;align-items:center;gap:8px}
.nav .t{flex:1;text-align:center}
.iconbtn{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:10px;width:42px;height:42px;font-size:20px;cursor:pointer}
.bar{height:10px;background:#0f1417;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--accent)}
.setrow{display:flex;gap:6px;align-items:center;margin:6px 0}
.setrow .in{text-align:center;padding:9px 4px}
.sn{width:20px;color:var(--muted);text-align:center;font-size:13px}.x,.u{color:var(--muted);font-size:13px}
.chk{width:44px;height:42px;border-radius:10px;border:1px solid var(--line);background:#0f1417;color:var(--muted);font-size:18px;cursor:pointer;flex:none}
.chk.on{background:var(--accent);color:#06241c;border-color:var(--accent)}
.ex{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.ex:first-of-type{border-top:0;margin-top:0;padding-top:0}
.ex .nm{font-weight:700}.ex .tg{color:var(--accent);font-size:14px}
details summary{cursor:pointer;color:var(--blue);font-size:14px;margin:4px 0}
ul.tight{margin:6px 0;padding-left:20px}ul.tight li{margin:3px 0}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(15,20,23,.96);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabbar button{flex:1;background:none;border:0;color:var(--muted);font-size:12px;padding:8px 2px;cursor:pointer;font-weight:600}
.tabbar button.on{color:var(--accent)}
.tabbar button b{display:block;font-size:18px;line-height:1.1;margin-bottom:2px}
.stat{flex:1;background:var(--card2);border-radius:12px;padding:10px;min-width:0}
.stat .v{font-size:20px;font-weight:700}.stat .l{font-size:12px;color:var(--muted)}
.good{color:var(--accent)}.bad{color:var(--warn)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.th{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.pgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer}
.heat{display:flex;gap:4px}.heat div{flex:1;text-align:center;font-size:11px;color:var(--muted)}.heat i{display:block;height:26px;border-radius:6px;margin-bottom:3px;background:var(--accent)}
.bottles{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.bottles i{width:22px;height:34px;border-radius:6px 6px 8px 8px;border:2px solid var(--blue)}.bottles i.f{background:var(--blue)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-weight:600;font-size:12px}
.wl{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}.wl:last-child{border:0}
.mono{font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));background:#e8eef2;color:#0f1417;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:20}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px}
.viewer img{max-width:100%;max-height:70vh;border-radius:10px}
.tmr{position:fixed;inset:0;background:var(--bg);z-index:30;overflow:auto;padding:calc(14px + env(safe-area-inset-top)) 14px 30px}
.tmr-in{max-width:560px;margin:0 auto}
.tcard{border-radius:18px;padding:22px 14px;text-align:center;margin:12px 0;color:#fff}
.tcard .tn{font-size:28px;font-weight:800;letter-spacing:1px}.tcard .tt{font-size:96px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}.tcard .ts{font-size:16px;opacity:.9;margin-bottom:12px}
.tcard .btn{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.4)}
#tbar{position:fixed;left:10px;right:10px;bottom:calc(68px + env(safe-area-inset-bottom));z-index:7;border-radius:14px;padding:8px 12px;display:flex;gap:8px;align-items:center;color:#fff;font-weight:700;max-width:540px;margin:0 auto}
#tbar .tbn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#tbar .tbt{font-size:22px;font-variant-numeric:tabular-nums}
#tbar button{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:10px;padding:6px 10px;font-size:14px;font-weight:700;cursor:pointer}
svg text{font-family:inherit}
#hrov{z-index:40}
.hrtap{width:100%;height:150px;border-radius:20px;border:0;background:#c0392b;color:#fff;font-size:26px;font-weight:800;touch-action:manipulation;-webkit-user-select:none;user-select:none;margin:10px 0}
.hrtap:active{background:#e74c3c}
.zb{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}.zb i{display:block;height:14px;border-radius:5px;background:var(--accent)}
</style>
</head>

<script>
(function(){
'use strict';

/* ---------- storage ---------- */
var KEY='dayone.v1';
function blank(){return {settings:null,weights:[],days:{},tests:[]};}
function load(){try{var j=JSON.parse(localStorage.getItem(KEY));if(j&&typeof j==='object'){var b=blank();b.settings=j.settings||null;b.weights=Array.isArray(j.weights)?j.weights:[];b.days=j.days||{};b.tests=Array.isArray(j.tests)?j.tests:[];return b;}}catch(e){}return blank();}
var S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('Could not save (storage full or blocked)');}}

/* ---------- helpers ---------- */
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymd(d);}
function diffDays(a,b){return Math.round((parse(b)-parse(a))/864e5);}
function today(){return ymd(new Date());}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function fmtD(s){return parse(s).toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function fmtLong(s){return parse(s).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});}
function f1(n){return n.toFixed(1);}
function sgn(n){return (n>0?'+':n<0?'−':'')+Math.abs(n).toFixed(1);}
function mean(a){return a.reduce(function(x,y){return x+y;},0)/a.length;}
function ensureDay(d){return S.days[d]||(S.days[d]={});}
function getDay(d){return S.days[d]||{};}

/* ---------- plan content ---------- */
var EX={
 goblet:{n:'Goblet squat',r:[8,12],inc:5,cue:'Hold one dumbbell upright at your chest. Sit straight down between your knees as deep as you can control, pause 1 sec in the bottom stretch, drive up fast. Rest 90 sec.'},
 inclinepress:{n:'Incline dumbbell press',r:[8,12],inc:5,cue:'Bench at 30 degrees. Lower for 3 sec until you feel a deep stretch across your upper chest, pause 1 sec, press up fast. Rest 90 sec.'},
 dbbench:{n:'Dumbbell bench press',r:[8,12],inc:5,cue:'Dumbbells at chest level, elbows about 45 degrees from your body. Lower for 3 sec to a deep chest stretch, pause, press up fast. Rest 90 sec.'},
 cablefly:{n:'Cable fly',iso:true,r:[10,15],inc:5,cue:'Cables at shoulder height, slight bend in the elbows. Let your hands travel back until you feel a deep chest stretch under tension (3 sec), then sweep together fast and squeeze 1 sec.'},
 chestrow:{n:'Chest-supported row',r:[8,12],inc:5,cue:'Chest on an incline bench or machine pad. Let your shoulder blades spread forward at the bottom (deep lat stretch), then pull your elbows to your back pockets fast and squeeze 1 sec.'},
 pulldown:{n:'Lat pulldown (or assisted pull-up)',r:[8,12],inc:10,cue:'Reach up for a full lat stretch at the top, pull the bar to your upper chest with elbows down and back, squeeze 1 sec, return in 3 sec. Use less assistance as it gets easy to work toward unassisted pull-ups.'},
 straightarm:{n:'Straight-arm pulldown',iso:true,r:[12,15],inc:5,cue:'Cable at head height, arms nearly straight. Let the bar rise until your lats are fully stretched, sweep it to your thighs fast, squeeze 1 sec, return in 3 sec.'},
 facepull:{n:'Face pull',iso:true,r:[12,20],inc:5,cue:'Rope at face height. Pull toward your forehead with elbows high and squeeze your shoulder blades 1 sec. Return in 3 sec. Light weight, strict form.'},

 legext:{n:'Leg extension',iso:true,r:[10,15],inc:10,cue:'Pad on your shins, back against the seat. Kick up fast, squeeze the quads 1 sec at the top, lower for 4 sec all the way to the bottom stretch.'},
 legcurl:{n:'Seated or lying leg curl',iso:true,r:[10,15],inc:10,cue:'Set the pad so your hamstrings are fully lengthened at the start. Curl fast, squeeze 1 sec, lower for 4 sec back to the full stretch.'},
 calf:{n:'Standing calf raise (full stretch)',iso:true,r:[10,15],inc:10,cue:'On a machine or step, drop your heels to a full stretch for 1 sec, rise fast, squeeze 1 sec at the top, lower for 3 sec.'},
 dbrdl:{n:'Dumbbell Romanian deadlift',r:[8,12],inc:5,cue:'Dumbbells at thighs, soft knees. Push hips back for 3 sec until you feel a deep hamstring stretch (dumbbells reach mid-shin), back flat, pause 1 sec, then drive hips forward fast. Rest 90 sec.'},
 hipthrust:{n:'Hip thrust',r:[8,12],inc:10,cue:'Upper back on a bench, a dumbbell or barbell across the hips. Drive hips up fast until you are flat from shoulders to knees, squeeze glutes 1 sec, lower for 3 sec.'},
 split:{n:'Bulgarian split squat (reps per leg)',r:[8,12],inc:5,cue:'Rear foot on a bench, dumbbells in hands. Lower for 3 sec into a deep stretch in the front hip and quad, pause 1 sec, drive up fast through the front heel.'},
 backext:{n:'Back extension (45 degree)',iso:true,bw:true,r:[10,15],inc:5,cue:'Hips on the pad, round slightly down for a stretch in your lower back and hamstrings (3 sec), then raise fast to a straight line and squeeze glutes 1 sec. Hold a plate on your chest when bodyweight gets easy. No bench? Face-down floor lifts.'},
 cablecrunch:{n:'Kneeling cable crunch',iso:true,r:[10,15],inc:5,cue:'Kneel facing a high cable with a rope behind your head. Curl your ribs to your pelvis fast and exhale hard, hold 1 sec, then rise slowly over 3 sec until your abs are stretched. Hips stay still.'},
 hangleg:{n:'Hanging leg raise (knees bent is fine)',iso:true,bw:true,r:[8,15],inc:0,cue:'Hang from a bar, shoulders pulled down. Curl your pelvis up as you lift your legs, no swinging, lower for 3 sec. No bar? Lying reverse crunches.'},
 abwheel:{n:'Ab wheel rollout',iso:true,bw:true,r:[6,12],inc:0,cue:'On your knees, roll out slowly over 3 sec as far as you can without your lower back sagging (abs lengthened under tension), then pull back with your abs. Start with a short range. No wheel? Slow body-saw plank.'},
 plank:{n:'Plank',timed:true,iso:true,r:[30,60],inc:5,cue:'Forearms on the floor, body in a straight line, squeeze glutes and abs hard. Stop the set when your hips sag. Rest 45 sec.'},

 pallof:{n:'Pallof press (reps per side)',iso:true,r:[10,15],inc:5,cue:'Cable at chest height, stand sideways. Hold the handle at your chest, press straight out in 1 sec and resist the twist, hold 2 sec, return in 3 sec.'},
 deadbug:{n:'Dead bug (reps per side)',iso:true,bw:true,r:[8,12],inc:0,cue:'On your back, arms up, knees bent 90 degrees. Slowly lower the opposite arm and leg while your lower back stays pressed into the floor.'},
 farmer:{n:'Farmer carry',timed:true,r:[30,60],inc:5,cue:'Heavy dumbbells at your sides, stand tall, ribs down, walk with short steady steps for the time. Rest 60 sec.'}
};
var WORKOUTS={
 6:{name:'Full body + incline walk',ex:[['goblet',3],['inclinepress',3],['chestrow',3],['legcurl',3],['cablecrunch',3],['plank',3]],cardio:['incline']},
 0:{name:'Pool intervals (about 30 min)',ex:[],cardio:['pool_sun']},
 1:{name:'Speed, agility and plyometrics',cardioFirst:true,ex:[['abwheel',3],['sideplank',3]],cardio:['speed']},

 3:{name:'Chest, back and abs',ex:[['dbbench',3],['inclinepress',3],['cablefly',3],['pulldown',3],['chestrow',3],['facepull',3],['abwheel',3]],cardio:['finisher']},
 4:{name:'Pool intervals (about 40 min)',ex:[],cardio:['pool_thu']},
 5:{name:'Glutes, hamstrings, lower back and core',ex:[['dbrdl',3],['hipthrust',3],['split',3],['backext',3],['pallof',3],['deadbug',3]],cardio:['bike10']}
};
function poolR(wk,base){return Math.min(base+4,base+Math.floor((wk-1)/3));}
function pool(wk,base,name){
 var r=poolR(wk,base),lengths=4+r*4+2,m=(base===6?30:40)+3*(r-base);
 return {t:name,m:m,steps:[
  'Warm-up: 4 lengths easy (freestyle or breaststroke). Rest 20 sec.',
  'Main set: '+r+' rounds. Each round = 2 lengths HARD (8/10 effort, breathing hard) then 2 lengths EASY (slow, relaxed). Rest 15 sec at the wall after every round.',
  'Cool-down: 2 lengths easy backstroke or breaststroke.',
  'Total: '+lengths+' lengths (one length = one end to the other). Then do the stretch routine.']};
}
var CARDIO={
 incline:function(wk){var m=15+Math.min(15,Math.floor((wk-1)/4)*5),inc=Math.min(12,8+Math.floor((wk-1)/3));return {t:'Incline walk',m:m,steps:[m+' min on a treadmill at 3.0 mph and '+inc+'% incline (or stair machine, or a fast outdoor walk with hills).','Do not hold the handrails.','Target: sweating by minute 8, breathing hard but able to say a short sentence.']};},

 bike10:function(){return {t:'Easy bike',m:10,steps:['10 min stationary bike, resistance 5/10, 80-90 rpm.','Keep it steady and let your legs flush out.']};},
 zone2:function(wk){var m=Math.min(60,40+5*Math.floor((wk-1)/4));return {t:'Zone 2 cardio',m:m,steps:['5 min easy warm-up (jog, bike, or incline walk).',(m-10)+' min steady at a pace where you can talk in full sentences but not sing. Heart rate about 60-70% of max (220 minus your age).','5 min easy cool-down.','Then do the stretch routine.']};},
 finisher:function(){return {t:'Interval finisher',m:10,steps:['10 min on a bike, rower, or treadmill.','5 rounds: 1 min HARD (8/10 effort) then 1 min EASY.']};},
 speed:function(wk){
  var ph=wk<=2?1:wk<=6?2:3;
  var spr=ph===1?'6 x 20 yd at 75% effort, smooth and relaxed, staying tall. Walk back to recover.':ph===2?'6 x 30 yd at 85-90% effort from a standing start. Walk back plus 30 sec rest.':'8 x 30-40 yd at 95% effort from a 2-point start. About 90 sec full recovery between reps.';
  var ag=ph===1?'5-10-5 shuttle x 3 at 75%. Lateral shuffles 10 yd x 4. Ladder: two feet in every box x 2, lateral in-out x 2.':ph===2?'5-10-5 shuttle x 4 at 85%. Lateral shuffles 10 yd x 6, staying low. Ladder: 3 patterns x 2. L-drill (3 cones, 5 yd apart) x 3.':'5-10-5 shuttle x 5 at full speed. L-drill x 4. Lateral shuffles 10 yd x 6 then sprint out 10 yd on a coach or partner call. Ladder: 4 patterns x 2.';
  var pl=ph===1?'3 x 6 fast step-ups on a 12-inch box. 3 x 8 small pogo hops. 3 x 5 squat jumps, land soft and stick it 2 sec. Rest 60 sec.':ph===2?'3 x 5 box jumps (16-20 inch box, step down). 3 x 5 broad jumps, stick each landing. 3 x 6 per side lateral bounds (skaters). Rest 60-90 sec.':'4 x 5 box jumps (20-24 inch box, step down). 3 x 5 broad jumps, then sprint 10 yd. 3 x 6 per side lateral bounds. 2 min jump rope. Rest 90 sec.';
  return {t:'Speed, agility and plyos',m:45,steps:[
   'Phase '+ph+' (weeks '+(ph===1?'1-2':ph===2?'3-6':'7+')+'). Do this on grass, a track or turf, not concrete, in supportive shoes.',
   'Warm-up (10 min): 5 min easy jog or bike. Then leg swings 10 per side, walking lunge with a twist 8 per side, A-skips 2 x 20 yd, high knees 2 x 20 yd, and 3 build-up runs of 40 yd (50%, 70%, 80%).',
   'Sprints: '+spr+' Stop the set early if your speed drops.',
   'Agility: '+ag,
   'Plyometrics: '+pl,
   'Cool-down: 5 min easy walk, then the stretch routine. If shins, knees, Achilles or hamstrings pinch or hurt, stay in the lower phase for two more weeks.']};
 },
 pool_sun:function(wk){return pool(wk,6,'Pool intervals');},
 pool_thu:function(wk){return pool(wk,8,'Pool intervals');}
};
var STRETCH=[
 ['Hip flexor lunge stretch','30 sec each side'],['Standing hamstring stretch (foot on a bench)','30 sec each side'],
 ['Figure-4 glute stretch (lying down)','30 sec each side'],["Child's pose (lower back)",'45 sec'],
 ['Cat-cow','10 slow reps'],['Doorway chest stretch','30 sec each side'],
 ['Standing quad stretch','30 sec each side'],['Open-book thoracic rotation (lying on your side)','8 reps each side']];
var SLOTS=['breakfast','lunch','snack','dinner','treat','other'];
var MEALS={
 breakfast:{label:'Breakfast (at work)',opts:[
  '3 eggs + 2 slices bacon (or 2 sausage links) + 1 piece of fruit. Coffee black, or with a splash of milk.',

};

function sessionsOf(ex,d){
 var ds=Object.keys(S.days).filter(function(k){return k<d;}).sort().reverse(),out=[],i;
 for(i=0;i<ds.length&&out.length<2;i++){var a=((S.days[ds[i]].sets||{})[ex]||[]).filter(function(z){return z&&z.done;});if(a.length)out.push({d:ds[i],a:a});}
 return out;
}
function sumF(a,f){return a.reduce(function(t,z){return t+(z[f]||0);},0);}
function topW(a){return Math.max.apply(null,a.map(function(z){return z.w||0;}));}
function sumTxt(a,x){return a.map(function(z){return x.timed?((z.r||'?')+'s'):((z.w||'BW')+'×'+(z.r||'?'));}).join(', ');}
function progress(id,d){
 var x=EX[id],ss=sessionsOf(id,d),lo=x.r[0],hi=x.r[1],inc=x.inc||0,A=ss[0],B=ss[1];
 if(!A)return {k:'first',t:x.timed?'First time: hold each set '+lo+' sec or more with clean form.':'First time: pick a weight you can lift for '+lo+'-'+Math.round((lo+hi)/2)+' reps with 2-3 reps left. Write it down.'};
 var aw=topW(A.a),allTop=A.a.every(function(z){return (z.r||0)>=hi;});
 if(x.timed){
  if(allTop)return {k:'weight',t:'You hit '+hi+' sec on every set. Make it harder: '+(id==='farmer'?'add '+inc+' lb per hand':'wear a weight vest/plate on your back or use a longer lever')+' and drop back to '+lo+' sec.'};
  return {k:'reps',t:'Add time: beat '+sumTxt(A.a,x)+' by about 5 sec on each set.'};
 }
 if(allTop){
  if(!aw)return {k:'weight',t:'You hit '+hi+' reps on every set. Make it harder: hold a '+(x.iso?'5-10':'10')+' lb weight or slow the lowering to 4-5 sec.'};
  return {k:'weight',t:'Add weight: '+(aw+inc)+' lb. Last time you hit '+hi+' reps on every set. Expect about '+lo+'-'+(lo+2)+' reps, then rebuild.'};
 }
 var lastMove='none';
 if(B){var bw=topW(B.a);if(aw>bw)lastMove='weight';else if(aw===bw&&sumF(A.a,'r')>sumF(B.a,'r'))lastMove='reps';}
 if(B&&lastMove==='none'){
  if(x.iso)return {k:'tempo',t:'Stalled on '+(aw?aw+' lb':'bodyweight')+'? Same load, harder reps: lower for 4-5 sec into a full stretch, squeeze 1 sec at the peak, then fast up. Beat last time on any set.'};
  return {k:'repeat',t:'Repeat '+(aw?aw+' lb':'bodyweight')+' and try for 1 more rep on any set ('+sumTxt(A.a,x)+'). If it stalls again, drop 10% and rebuild.'};
 }
 var avg=sumF(A.a,'r')/A.a.length;
 if(lastMove==='reps'&&avg>=(lo+hi)/2&&aw)return {k:'weight',t:'Add weight: '+(aw+inc)+' lb. Reps may dip, that is fine.'};
 return {k:'reps',t:'Add reps: keep '+(aw?aw+' lb':'bodyweight')+' and beat last time ('+sumTxt(A.a,x)+') by 1 rep on at least 2 sets.'};
}
function weekOf(d){return Math.max(1,Math.floor(diffDays(S.settings.startDate,d)/7)+1);}
function phaseText(wk){
 if(wk<=2)return 'Weeks 1-2: learn the load. Slow 3-sec lowering, pause in the stretch, fast up. Early sets 2-3 reps shy of failure, last set 2 reps left while you find your weights.';
 if(wk<=8)return 'Weeks 3-8: build. Early sets 2-3 reps shy of failure, last set pushed to 1 rep left. When you hit the top reps on every set, add 5 lb next time (2.5 lb on small dumbbells).';
 return 'Weeks 9+: push. Same tempo and effort, add a rep or a little weight every week. Take a lighter week (20% less weight) every 6-8 weeks.';
}

function sortW(){S.weights.sort(function(a,b){return (a.date+a.time)<(b.date+b.time)?-1:1;});}
function wSeries(){
 var by={};S.weights.forEach(function(e){(by[e.date]=by[e.date]||[]).push(e.w);});
 var mn=Object.keys(by).sort().map(function(d){return {d:d,v:mean(by[d])};});
 var ma=mn.map(function(m){var from=addDays(m.d,-6);var win=mn.filter(function(x){return x.d>=from&&x.d<=m.d;});return {d:m.d,v:mean(win.map(function(x){return x.v;}))};});
 return {mean:mn,ma:ma};
}
function gl(d){var st=S.settings,total=Math.max(1,diffDays(st.startDate,st.goalDate));var t=Math.min(1,Math.max(0,diffDays(st.startDate,d)/total));return st.startWeight+(st.goalWeight-st.startWeight)*t;}
function lastSets(ex,d){
 var ds=Object.keys(S.days).filter(function(k){return k<d;}).sort().reverse();
 for(var i=0;i<ds.length;i++){var a=S.days[ds[i]].sets&&S.days[ds[i]].sets[ex];if(a&&a.some(function(s){return s&&(s.w!=null||s.r!=null);}))return a.filter(function(s){return s&&(s.w!=null||s.r!=null);});}
 return [];
}
function dayStats(d){
 var D=getDay(d),plan=WORKOUTS[parse(d).getDay()],done=0,total=0,active=false;
 plan.ex.forEach(function(e){total++;var arr=(D.sets&&D.sets[e[0]])||[];var n=arr.filter(function(x){return x&&x.done;}).length;if(n>0)active=true;if(n>=e[1])done++;});
 plan.cardio.forEach(function(c){total++;var x=D.cardio&&D.cardio[c];if(x&&x.done){done++;active=true;}});
 total++;if(D.checks&&D.checks.stretch)done++;
 ['breakfast','lunch','snack','dinner'].forEach(function(s){total++;if(D.meals&&D.meals[s])done++;});
 total++;if((D.water||0)>=(S.settings.waterGoal||7))done++;
 total++;if(S.weights.some(function(w){return w.date===d;}))done++;
 total++;if(D.sleep&&D.sleep.hours)done++;
 return {done:done,total:total,pct:total?done/total:0,active:active};
}
function streak(){

 return n;
}

 if(n){x1=td;if(lastE&&lastE.date>x1)x1=lastE.date;x0=addDays(x1,-(n-1));}
 else{x0=st.startDate;if(S.weights.length&&S.weights[0].date<x0)x0=S.weights[0].date;x1=st.goalDate>td?st.goalDate:td;}
 var span=Math.max(1,diffDays(x0,x1)),pts=S.weights.filter(function(e){return e.date>=x0&&e.date<=x1;}),mav=sr.ma.filter(function(m){return m.d>=x0&&m.d<=x1;});
 var ga=x0>st.startDate?x0:st.startDate,gb=x1<st.goalDate?x1:st.goalDate,vals=pts.map(function(p){return p.w;}).concat(mav.map(function(m){return m.v;}));

 else if(type==='rest'){beep(523,0.18,0,0.7);beep(523,0.18,0.3,0.7);say('Rest');}
 else if(type==='prep'){beep(440,0.2,0,0.6);say('Get ready');}
 else if(type==='tick'){beep(740,0.12,0,0.55);}
 else if(type==='done'){beep(659,0.2,0,0.7);beep(784,0.2,0.28,0.7);beep(1047,0.6,0.56,0.7);say('Done');}
 try{if(navigator.vibrate)navigator.vibrate(type==='work'||type==='go'?300:type==='done'?[200,100,200,100,400]:type==='tick'?60:150);}catch(e){}
}

  '<div class="row" style="margin-top:8px"><input class="in" inputmode="numeric" placeholder="Age" value="'+(st.hrAge||'')+'" data-chg="setting" data-k="hrAge" aria-label="Age"><input class="in" inputmode="numeric" placeholder="Max HR (optional)" value="'+(st.hrMax||'')+'" data-chg="setting" data-k="hrMax" aria-label="Known max heart rate"></div>'+

function hrSave(){

 else{D.hr=D.hr||[];D.hr.push({id:uid(),t:nowT(),bpm:Math.round(v),kind:HR.kind});D.hr.sort(function(a,b){return a.t<b.t?-1:1;});}

}

 case 'viewphoto':openViewer(t.dataset.id);break;
 case 'closeviewer':{var v=$('#viewer');if(v)v.remove();break;}

 case 'wadd':{

function chg(k,t){
 var D;
 switch(k){
 case 'set':{D=ensureDay(UI.date);D.sets=D.sets||{};var ex=t.dataset.ex,i=+t.dataset.i;D.sets[ex]=D.sets[ex]||[];while(D.sets[ex].length<=i)D.sets[ex].push({});var s=D.sets[ex][i]||(D.sets[ex][i]={});s[t.dataset.f]=numOrU(t.value);if(s[t.dataset.f]===undefined)delete s[t.dataset.f];save();updateBar();break;}
 case 'cardio':{D=ensureDay(UI.date);D.cardio=D.cardio||{};var c=D.cardio[t.dataset.id]||(D.cardio[t.dataset.id]={}),f=t.dataset.f;if(f==='note')c.note=t.value;else{var n=numOrU(t.value);if(n===undefined)delete c[f];else c[f]=n;}save();var hz=$('#hz-'+t.dataset.id);if(hz)hz.textContent=hrLine(c);break;}
 case 'mealnote':D=ensureDay(UI.date);D.mealNotes=D.mealNotes||{};D.mealNotes[t.dataset.slot]=t.value;
  if(t.value.trim()){D.meals=D.meals||{};if(!D.meals[t.dataset.slot])D.meals[t.dataset.slot]='swap';}
  save();render();break;

 case 'tmetric':UI.tmetric=t.value;render();break;
 case 'cmpsel':UI.cmp[t.dataset.w]=t.value;fillPhotos();break;
 case 'bphoto':{
  var bf=t.files&&t.files[0],pose=UI.bpose,bd=($('#bp-date')&&$('#bp-date').value)||today();if(!bf)return;
  Promise.all([scaled(bf,1000,0.82),scaled(bf,260,0.7)]).then(function(r3){return bPut({id:uid(),date:bd,pose:pose,ts:Date.now(),full:r3[0],thumb:r3[1]});}).then(function(){toast('Photo saved');if(!S.settings.lastCheckin||bd>S.settings.lastCheckin){S.settings.lastCheckin=bd;save();}if(UI.tab==='photos')render();}).catch(function(){toast('Could not save photo');});

}
